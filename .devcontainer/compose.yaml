services:
  rails-app:
    image: ghcr.io/firstdraft/drawing-board-workspace@sha256:39999b32dfc1e02f67044b875bf03ffb2efc4066cb46418657516e50bba5ba4d
    volumes:
      - ..:/workspaces/drawing-board:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  selenium:
    image: selenium/standalone-chromium:4.47.0-20260808@sha256:1d3d834a2ce93f26cc0d0ae3c61abd189755b32649f5c356c6c5cf9502aa397e
    environment:
      SE_NODE_MAX_SESSIONS: "2"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_SESSION_REQUEST_TIMEOUT: "30"
    shm_size: 2gb

  postgres:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 25

volumes:
  postgres-data:
