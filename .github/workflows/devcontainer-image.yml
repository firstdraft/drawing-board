name: Dev Container image

on:
  workflow_dispatch:
  push:
    tags: [devcontainer-image-candidate-*]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/image/devcontainer.json
          imageName: ghcr.io/firstdraft/drawing-board-devcontainer
          imageTag: sha-${{ github.sha }}
          platform: linux/amd64,linux/arm64
          push: always
